<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucía - Copiloto de Facturación</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="avatar">L</div>
            <div class="header-info">
                <h2>Lucía</h2>
                <p>Copiloto de Facturación</p>
            </div>
            <!-- Simulación de sesión para demos -->
            <div class="demo-controls">
                <select id="user-select">
                    <option value="user_a_fin_promo">User A (Fin de Promo)</option>
                    <option value="user_b_prorrateo">User B (Prorrateo)</option>
                    <option value="user_c_equipo">User C (Cuota Equipo)</option>
                    <option value="user_d_reconexion">User D (Reconexión)</option>
                    <option value="user_e_alerta_proactiva">User E (Alerta Proactiva)</option>
                </select>
                <button type="button" class="admin-link" onclick="nuevaConversacion()" title="Nueva conversación (olvida la sesión actual)">↻</button>
                <a href="admin.html" class="admin-link" title="Panel de administración">⚙</a>
            </div>
        </header>
        
        <main class="chat-messages" id="chat-messages">
            <!-- Los mensajes se insertarán aquí dinámicamente -->
            <div class="message bot">
                <div class="bubble">¡Hola! Soy Lucía, tu asistente virtual. ¿En qué puedo ayudarte con tus recibos hoy?</div>
            </div>
        </main>
        
        <footer class="chat-input">
            <input type="text" id="message-input" placeholder="Escribe tu consulta aquí..." autocomplete="off">
            <button id="send-button">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
