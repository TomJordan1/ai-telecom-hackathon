<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucía - Copiloto de Facturación Movistar</title>
    <link rel="stylesheet" href="styles.css?v=10">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="avatar">L</div>
            <div class="header-info">
                <h2>Lucía</h2>
                <p>Copiloto de Facturación · Movistar</p>
            </div>
            <div class="header-actions">
                <span class="session-badge" id="session-badge">Visitante</span>
                <button type="button" class="btn-icon" onclick="nuevaConversacion()" title="Reiniciar conversación">↻</button>
                <a href="admin.html" class="btn-icon" title="Panel de administración">⚙</a>
            </div>
        </header>

        <main class="chat-messages" id="chat-messages">
            <!-- Mensajes dinámicos generados por Lucía y el usuario -->
        </main>

        <div class="quick-chips" id="quick-chips">
            <!-- Sugerencias de 1 clic -->
        </div>

        <footer class="chat-input-area">
            <input type="text" id="message-input" placeholder="Escribe un mensaje o tu número de cuenta..." autocomplete="off">
            <button id="send-button" type="button" title="Enviar">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </footer>
    </div>

    <script src="app.js?v=10"></script>
</body>
</html>
